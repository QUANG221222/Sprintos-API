version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: sprintos_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7-alpine
    container_name: sprintos_redis
    restart: always
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: sprintos_dev
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      # Ghi đè DATABASE_URL để kết nối tới database container (db:5432) thay vì localhost
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      NODE_ENV: development
      NODE_OPTIONS: '--max-old-space-size=4096'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      db:
        condition: service_healthy
    # Đảm bảo generate Prisma client, chạy migrations và build project khi khởi động container, sau đó start dev (watch mode)
    command: >
      sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - dev

  # Service Production cho NestJS API
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: sprintos_api_prod
    ports:
      - '8080:8080'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/src/main.js"
    restart: always
    profiles:
      - prod

volumes:
  postgres_dev_data:
  redis_data:
