server {
    listen 80;
    server_name sprintos.nhatquangdev.id.vn;

    # Dùng cho certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect toàn bộ sang HTTPS sau khi có cert
    location / {
        return 301 https://$host$request_uri;
    }
}